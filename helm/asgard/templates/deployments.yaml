apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "asgard.fullname" . }}-api
  labels:
    app.kubernetes.io/component: api
    {{- include "asgard.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "asgard.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "asgard.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.containerPort }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "asgard.fullname" . }}-env
            - secretRef:
                name: {{ include "asgard.fullname" . }}-secret-env
          env:
            - name: PORT
              value: {{ .Values.api.containerPort | quote }}
{{- range $name, $value := .Values.api.extraEnv }}
            - name: {{ $name }}
              value: {{ tpl (printf "%v" $value) $ | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "asgard.fullname" . }}-jobs
  labels:
    app.kubernetes.io/component: jobs
    {{- include "asgard.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "asgard.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: jobs
  template:
    metadata:
      labels:
        {{- include "asgard.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: jobs
    spec:
      containers:
        - name: jobs
          image: "{{ .Values.images.jobs.repository }}:{{ .Values.images.jobs.tag }}"
          imagePullPolicy: {{ .Values.images.jobs.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "asgard.fullname" . }}-env
            - secretRef:
                name: {{ include "asgard.fullname" . }}-secret-env
          env:
{{- range $name, $value := .Values.jobs.extraEnv }}
            - name: {{ $name }}
              value: {{ tpl (printf "%v" $value) $ | quote }}
{{- end }}
          volumeMounts:
            - name: jobs-data
              mountPath: /app/data
      volumes:
        - name: jobs-data
          emptyDir: {}
---
