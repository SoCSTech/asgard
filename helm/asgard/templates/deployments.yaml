---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "asgard.fullname" . }}-db
  labels:
    app.kubernetes.io/component: db
    {{- include "asgard.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "asgard.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: db
  template:
    metadata:
      labels:
        {{- include "asgard.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: db
    spec:
      containers:
        - name: db
          image: "{{ .Values.images.db.repository }}:{{ .Values.images.db.tag }}"
          imagePullPolicy: {{ .Values.images.db.pullPolicy }}
          command:
            - --default-authentication-plugin=mysql_native_password
            - --character-set-server=utf8
            - --collation-server=utf8_general_ci
          ports:
            - containerPort: {{ .Values.db.service.port }}
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: {{ tpl (printf "%v" .Values.secretEnv.DB_PASSWORD) $ | quote }}
            - name: MYSQL_DATABASE
              value: {{ tpl (printf "%v" .Values.env.DB_DATABASE) $ | quote }}
            - name: MYSQL_USER
              value: {{ tpl (printf "%v" .Values.env.DB_USERNAME) $ | quote }}
            - name: MYSQL_PASSWORD
              value: {{ tpl (printf "%v" .Values.secretEnv.DB_PASSWORD) $ | quote }}
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: {{ include "asgard.fullname" . }}-mysql-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "asgard.fullname" . }}-mqtt
  labels:
    app.kubernetes.io/component: mqtt
    {{- include "asgard.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "asgard.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mqtt
  template:
    metadata:
      labels:
        {{- include "asgard.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mqtt
    spec:
      containers:
        - name: mqtt
          image: "{{ .Values.images.mqtt.repository }}:{{ .Values.images.mqtt.tag }}"
          imagePullPolicy: {{ .Values.images.mqtt.pullPolicy }}
          ports:
            - containerPort: {{ .Values.mqtt.service.port }}
              name: mqtt
            - containerPort: {{ .Values.mqtt.websocketPort }}
              name: websockets
          volumeMounts:
            - name: mosquitto-config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
            - name: mqtt-data
              mountPath: /mosquitto/data
            - name: mqtt-log
              mountPath: /mosquitto/log
      volumes:
        - name: mosquitto-config
          configMap:
            name: {{ include "asgard.fullname" . }}-mosquitto-config
        - name: mqtt-data
          emptyDir: {}
        - name: mqtt-log
          emptyDir: {}
